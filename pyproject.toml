[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-destroyer"
version = "1.0.0"
description = "Smash, burn and saw your Linux desktop to pieces -- works on X11 and Wayland"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Philipp Weber" }]
keywords = ["game", "toy", "desktop", "wayland", "x11", "qt"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = ["PySide6>=6.5"]

[project.scripts]
desktop-destroyer = "desktop_destroyer.app:main"

[tool.setuptools]
packages = ["desktop_destroyer"]
